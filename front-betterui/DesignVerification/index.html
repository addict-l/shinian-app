<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾年 · SwiftUI 页面核验</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1e8dc;color:#3d2e24;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1420px;margin:auto;padding:48px 32px}h1{font-family:"Songti SC",serif;font-weight:500;font-size:34px;margin:0 0 12px}.sub{color:#6b5848;margin-bottom:32px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:32px 24px}article{min-width:0}.shot{padding:0;border:0;background:none;width:100%;cursor:zoom-in;border-radius:28px;box-shadow:0 12px 24px #78502825}.shot img{width:100%;height:auto;display:block;border-radius:28px}p{font-size:14px;margin:12px 2px}p b{color:#b9623d;margin-right:6px}button:focus-visible{outline:3px solid #b9623d;outline-offset:4px}dialog{border:0;border-radius:20px;padding:18px;background:#fffdf9;color:#3d2e24;max-height:94vh;max-width:94vw}dialog::backdrop{background:#3d2e24aa}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:30px}#large{display:block;max-height:80vh;max-width:86vw;height:auto;width:auto;border-radius:18px}#close{background:#f8e3d5;color:#b9623d;border:0;border-radius:22px;min-height:44px;padding:0 16px;cursor:pointer}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{padding:32px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}h1{font-size:28px}}
</style><main><h1>拾年 · 温馨版 SwiftUI</h1><div class="sub">15 个设计稿页面 · 已有 iPhone 17 Pro · iOS 26.5<br>点击截图放大。状态栏和灵动岛使用 iPhone 17 Pro 原生显示。本页保留离线设计截图；App 正常启动已接入真实后端。</div><div class="grid"><article><button class="shot" data-src="screenshots/01-login.png" data-title="01 欢迎回家" aria-label="放大欢迎回家"><img loading="lazy" src="screenshots/01-login.png" alt="iPhone 17 Pro 实机模拟截图：欢迎回家"></button><p><b>01</b> 欢迎回家</p></article><article><button class="shot" data-src="screenshots/02-home.png" data-title="02 首页" aria-label="放大首页"><img loading="lazy" src="screenshots/02-home.png" alt="iPhone 17 Pro 实机模拟截图：首页"></button><p><b>02</b> 首页</p></article><article><button class="shot" data-src="screenshots/03-home-empty.png" data-title="03 首页空态" aria-label="放大首页空态"><img loading="lazy" src="screenshots/03-home-empty.png" alt="iPhone 17 Pro 实机模拟截图：首页空态"></button><p><b>03</b> 首页空态</p></article><article><button class="shot" data-src="screenshots/04-add-person.png" data-title="04 添加人物" aria-label="放大添加人物"><img loading="lazy" src="screenshots/04-add-person.png" alt="iPhone 17 Pro 实机模拟截图：添加人物"></button><p><b>04</b> 添加人物</p></article><article><button class="shot" data-src="screenshots/05-select-person.png" data-title="05 选择人物" aria-label="放大选择人物"><img loading="lazy" src="screenshots/05-select-person.png" alt="iPhone 17 Pro 实机模拟截图：选择人物"></button><p><b>05</b> 选择人物</p></article><article><button class="shot" data-src="screenshots/06-chat.png" data-title="06 AI 对话" aria-label="放大AI 对话"><img loading="lazy" src="screenshots/06-chat.png" alt="iPhone 17 Pro 实机模拟截图：AI 对话"></button><p><b>06</b> AI 对话</p></article><article><button class="shot" data-src="screenshots/07-review.png" data-title="07 回忆预览" aria-label="放大回忆预览"><img loading="lazy" src="screenshots/07-review.png" alt="iPhone 17 Pro 实机模拟截图：回忆预览"></button><p><b>07</b> 回忆预览</p></article><article><button class="shot" data-src="screenshots/08-memories.png" data-title="08 所有回忆" aria-label="放大所有回忆"><img loading="lazy" src="screenshots/08-memories.png" alt="iPhone 17 Pro 实机模拟截图：所有回忆"></button><p><b>08</b> 所有回忆</p></article><article><button class="shot" data-src="screenshots/09-story.png" data-title="09 回忆详情" aria-label="放大回忆详情"><img loading="lazy" src="screenshots/09-story.png" alt="iPhone 17 Pro 实机模拟截图：回忆详情"></button><p><b>09</b> 回忆详情</p></article><article><button class="shot" data-src="screenshots/10-family.png" data-title="10 家庭胶片" aria-label="放大家庭胶片"><img loading="lazy" src="screenshots/10-family.png" alt="iPhone 17 Pro 实机模拟截图：家庭胶片"></button><p><b>10</b> 家庭胶片</p></article><article><button class="shot" data-src="screenshots/11-person.png" data-title="11 人物资料" aria-label="放大人物资料"><img loading="lazy" src="screenshots/11-person.png" alt="iPhone 17 Pro 实机模拟截图：人物资料"></button><p><b>11</b> 人物资料</p></article><article><button class="shot" data-src="screenshots/12-memoir.png" data-title="12 制作回忆录" aria-label="放大制作回忆录"><img loading="lazy" src="screenshots/12-memoir.png" alt="iPhone 17 Pro 实机模拟截图：制作回忆录"></button><p><b>12</b> 制作回忆录</p></article><article><button class="shot" data-src="screenshots/13-profile.png" data-title="13 我的" aria-label="放大我的"><img loading="lazy" src="screenshots/13-profile.png" alt="iPhone 17 Pro 实机模拟截图：我的"></button><p><b>13</b> 我的</p></article><article><button class="shot" data-src="screenshots/14-settings.png" data-title="14 设置" aria-label="放大设置"><img loading="lazy" src="screenshots/14-settings.png" alt="iPhone 17 Pro 实机模拟截图：设置"></button><p><b>14</b> 设置</p></article><article><button class="shot" data-src="screenshots/15-privacy.png" data-title="15 隐私与数据" aria-label="放大隐私与数据"><img loading="lazy" src="screenshots/15-privacy.png" alt="iPhone 17 Pro 实机模拟截图：隐私与数据"></button><p><b>15</b> 隐私与数据</p></article></div></main><dialog id="viewer"><div class="head"><strong id="caption"></strong><button id="close">关闭</button></div><img id="large" alt=""></dialog><script>
const viewer=document.getElementById('viewer');document.querySelectorAll('.shot').forEach(b=>b.addEventListener('click',()=>{document.getElementById('large').src=b.dataset.src;document.getElementById('large').alt=b.dataset.title;document.getElementById('caption').textContent=b.dataset.title;viewer.showModal()}));document.getElementById('close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
</script></html>
